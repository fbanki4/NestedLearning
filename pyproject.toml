[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-torch"
version = "0.1.0"
description = "Frozen-model multi-frequency retrofit with a J-space global-workspace schedule and an RL plasticity controller, for continual learning on EEG foundation models."
readme = "nested_torch/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Farid Banki", email = "faridbanki4@gmail.com" }]
keywords = [
    "continual-learning", "nested-learning", "catastrophic-forgetting",
    "eeg", "foundation-models", "reinforcement-learning", "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/fbanki4/NestedLearning"
Source = "https://github.com/fbanki4/NestedLearning/tree/main/nested_torch"

# Only the PyTorch proof-of-concept is packaged here. The original JAX teaching
# implementation (nested_learning/) has its own requirements.txt and jax deps.
[tool.setuptools]
packages = ["nested_torch"]

[tool.pytest.ini_options]
testpaths = ["tests_pytorch"]
addopts = "-q"
